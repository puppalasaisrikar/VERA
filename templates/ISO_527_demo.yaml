standard_id: ISO_527_demoversion: "1.0"units:  tensile_strength: MPa  elongation_at_break: "%"  modulus: GPametadata_required:  - specimen_type  - test_speed_mm_per_minchecks:  - metric: tensile_strength    op: ">="    value: 50    unit: MPa    note: "Minimum tensile strength"  - metric: elongation_at_break    op: ">="    value: 10    unit: "%"    note: "Ductility threshold"  - metric: modulus    op: "between"    min: 1.5    max: 3.5    unit: GPa    note: "Expected modulus range"grouping:  lot_id: lot