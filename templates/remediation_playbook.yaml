rules:  - when_metric: tensile_strength    trigger: below_min        # FAIL on >= threshold    suggestions:      - "Increase draw ratio or adjust quench to boost strength."      - "Verify grip slippage; re-surface grips and re-tighten."      - "Check specimen width/thickness tolerance; re-machine if out."  - when_metric: elongation_at_break    trigger: below_min    suggestions:      - "Reduce test speed to method spec; confirm extensometer alignment."      - "Inspect edges for nicks/notches; polish per standard."      - "Condition specimens (temp/humidity) before test."  - when_metric: modulus    trigger: outside_range    suggestions:      - "Recalibrate extensometer and zero strain before loading."      - "Confirm temperature; modulus is temperature-sensitive."      - "Check early-strain linear fit window (≤0.5%)."  - when_metric: specimen_type    trigger: missing    suggestions:      - "Add specimen type (e.g., Type I/IV); some limits depend on it."  - when_metric: test_speed_mm_per_min    trigger: missing    suggestions:      - "Record crosshead speed (mm/min); required for compliance."